<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Immo-Kartei</title>
<!-- iPhone: „Zum Home-Bildschirm“ öffnet die App ohne Safari-Leisten -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Immo-Kartei">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- Schreibt GPS-Standort und Aufnahmezeit in die Originalfotos (EXIF) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.min.js"></script>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --text: #1d2330;
    --muted: #6b7385;
    --line: #e2e5eb;
    --accent: #1f6feb;
    --offen: #1f6feb;
    --erledigt: #2da44e;
    --fehler: #cf222e;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
  }
  header {
    position: sticky; top: 0; z-index: 1100;  /* über den Leaflet-Knöpfen (1000) */
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 10px 16px;
    padding-top: max(10px, env(safe-area-inset-top));
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  h1 { margin: 0; font-size: 1.25rem; flex: 1; }
  main { max-width: 900px; margin: 0 auto; padding: 12px 16px 40px; }
  .btn {
    display: inline-block;
    background: var(--accent); color: #fff;
    border: 0; border-radius: 8px;
    padding: 10px 14px; font-size: 1rem; font-weight: 600;
    cursor: pointer;
  }
  .btn.zweit { background: #e9ecf2; color: var(--text); }
  .btn:disabled { opacity: .5; cursor: default; }
  #status { color: var(--muted); margin: 0 0 10px; min-height: 1.4em; }
  #karte {
    height: 55vh; min-height: 300px;
    border-radius: 10px; border: 1px solid var(--line);
    margin-bottom: 14px;
  }
  .leer {
    background: var(--panel); border: 1px dashed var(--line); border-radius: 10px;
    padding: 24px 16px; text-align: center; color: var(--muted);
  }
  .zaehler { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); margin-bottom: 8px; font-size: .95rem; }
  ul.liste { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  ul.liste li {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  ul.liste li:last-child { border-bottom: 0; }
  .zeile-weg {
    flex: none; border: 0; background: none; cursor: pointer;
    font-size: 1.1rem; padding: 8px; border-radius: 8px; opacity: .6;
  }
  .zeile-weg:hover { background: #fde8e8; opacity: 1; }
  ul.liste li:hover { background: #f7f8fa; }
  .punkt { width: 14px; height: 14px; border-radius: 50%; flex: none; background: var(--offen); }
  .punkt.bearbeitet { background: var(--erledigt); }
  .punkt.fehler { background: var(--fehler); }
  .adr { flex: 1; min-width: 0; }
  .adr small { display: block; color: var(--muted); }
  .hinweis { color: var(--fehler); font-size: .85rem; }
  input[type=file] { display: none; }

  /* Tagesroute */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .panel h2 { margin: 0 0 10px; font-size: 1.1rem; }
  .feld { display: block; margin-bottom: 10px; font-size: .9rem; color: var(--muted); }
  .feld input[type=text], .feld input[type=number], .feld input[type=password], .feld select {
    display: block; width: 100%; margin-top: 4px;
    font-size: 1rem; padding: 9px 10px;
    border: 1px solid var(--line); border-radius: 8px; color: var(--text);
  }
  .zeile { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .zeile .feld { flex: 1; min-width: 140px; }
  .haken { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: .95rem; }
  .haken input { width: 20px; height: 20px; }
  .knoepfe { display: flex; gap: 10px; flex-wrap: wrap; }
  .etappe { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
  .etappe h3 { margin: 0 0 8px; font-size: 1rem; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .etappe h3 span { flex: 1; }
  .etappe a.btn { text-decoration: none; font-size: .95rem; padding: 8px 12px; }
  ol.stopps { margin: 0; padding: 0; list-style: none; }
  ol.stopps li { display: flex; gap: 10px; align-items: center; padding: 6px 0; cursor: pointer; }
  .nr {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    background: var(--accent); color: #fff; border: 2px solid #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px;
  }
  .nr.bearbeitet { background: var(--erledigt); }
  .nr.start { background: #1d2330; }

  /* Karteikarte (Vollbild-Ansicht einer Immobilie) */
  #karteikarte {
    position: fixed; inset: 0; z-index: 3000;
    background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .kk-kopf {
    position: sticky; top: 0; z-index: 1;
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
    display: flex; align-items: center; gap: 12px;
  }
  .kk-kopf span { flex: 1; text-align: right; color: var(--muted); font-size: .9rem; }
  .kk-inhalt { max-width: 700px; margin: 0 auto; padding: 14px 16px 60px; }
  .kk-inhalt h2 { margin: 0 0 4px; font-size: 1.3rem; }
  .kk-inhalt h3 { margin: 0 0 10px; font-size: 1.05rem; }
  .gedimmt { color: var(--muted); font-size: .92rem; }
  .btn.erledigt { background: var(--erledigt); }
  a.btn { text-decoration: none; }
  textarea {
    width: 100%; font: inherit; font-size: 1rem; padding: 10px;
    border: 1px solid var(--line); border-radius: 8px; resize: vertical;
  }
  .fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin-top: 12px; }
  .foto { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #e9ecf2; }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto .badge {
    position: absolute; left: 4px; bottom: 4px;
    background: rgba(0,0,0,.6); color: #fff; font-size: .72rem; padding: 2px 6px; border-radius: 6px;
  }
  .foto .weg {
    position: absolute; right: 4px; top: 4px; border: 0; border-radius: 6px;
    background: rgba(0,0,0,.55); color: #fff; font-size: .85rem; padding: 3px 6px; cursor: pointer;
  }
  .foto.wartet img { opacity: .55; }
  .popup-btn { margin-top: 6px; padding: 6px 10px; font-size: .9rem; }

  /* Foto-Karte in der Karteikarte */
  #kkKarte { height: 260px; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 14px; }
  @media (min-width: 768px) { #kkKarte { height: 400px; } }
  .nr.foto { background: #d97706; }
  .nr.haus { background: #fff; font-size: 14px; }
  .pp img {
    display: block; width: 200px; height: 150px; object-fit: cover;
    border-radius: 6px; background: #e9ecf2; cursor: zoom-in;
  }
  .pp div { margin-top: 4px; font-size: .85rem; }
  .foto img { cursor: zoom-in; }

  /* Vollbild-Ansicht eines Fotos */
  #vollbild {
    position: fixed; inset: 0; z-index: 4000; background: #000; color: #fff;
    display: flex; flex-direction: column;
  }
  #vollbild[hidden] { display: none; }
  .vb-kopf, .vb-fuss {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px; font-size: .9rem;
  }
  .vb-kopf { padding-top: max(10px, env(safe-area-inset-top)); }
  .vb-kopf span { flex: 1; }
  .vb-fuss { justify-content: center; padding-bottom: max(14px, env(safe-area-inset-bottom)); }
  .vb-fuss a { color: #9cc3ff; }
  .vb-buehne { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }
  #vbBild { max-width: 100%; max-height: 100%; object-fit: contain; }
  .vb-pfeil {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 50%;
    width: 46px; height: 46px; font-size: 1.8rem; line-height: 1; cursor: pointer;
  }
  .vb-pfeil.links { left: 10px; }
  .vb-pfeil.rechts { right: 10px; }

  /* Hinweisleisten unten (neue Version, Originale sichern) – liegen auch über der Karteikarte */
  #hinweise {
    position: fixed; left: 12px; right: 12px; z-index: 5000;
    bottom: max(12px, env(safe-area-inset-bottom));
    max-width: 520px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 8px;
  }
  .leiste {
    background: #1d2330; color: #fff; border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.3);
    padding: 12px 14px; display: flex; align-items: center; gap: 10px;
  }
  .leiste[hidden] { display: none; }
  .leiste span { flex: 1; }
  /* Originale: Text oben über die ganze Breite, darunter Knopf und ✕ */
  #originalHinweis { flex-wrap: wrap; }
  #originalHinweis span { flex: 1 1 100%; }
  #originalHinweis .btn { flex: 1; }
  .leiste .zu { background: none; border: 0; color: #fff; opacity: .7; font-size: 1.1rem; cursor: pointer; padding: 4px; }
  /* Platz unten frei halten, solange eine Leiste sichtbar ist */
  body.mit-leiste main, body.mit-leiste .kk-inhalt { padding-bottom: 150px; }

  /* Schmale Handys: Kopfzeile in einer Zeile halten */
  @media (max-width: 420px) {
    h1 { font-size: 1.05rem; white-space: nowrap; }
    header { gap: 8px; }
    header .btn { padding: 8px 10px; font-size: .9rem; }
  }
</style>
</head>
<body>
<header>
  <h1>🏠 Immo-Kartei</h1>
  <button class="btn zweit" id="cloudBtn" title="Google Drive">☁️ Verbinden</button>
  <label class="btn" for="datei">Excel laden</label>
  <input type="file" id="datei" accept=".xlsx,.xls,.csv">
</header>

<main>
  <p id="status"></p>

  <section class="panel" id="verbindungPanel" hidden>
    <h2>☁️ Google Drive</h2>
    <p id="verbindungInfo" style="margin:0 0 10px;color:var(--muted)"></p>
    <label class="feld">Web-App-Adresse
      <input type="text" id="vUrl" placeholder="https://script.google.com/macros/s/…/exec"
             autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    </label>
    <label class="feld">Zugangscode
      <input type="password" id="vCode" autocomplete="off">
    </label>
    <div class="knoepfe">
      <button class="btn" id="vVerbinden">Verbinden</button>
      <button class="btn zweit" id="vTrennen" hidden>Trennen</button>
      <button class="btn zweit" id="vSchliessen">Schließen</button>
    </div>
  </section>

  <section class="panel" id="neuPanel" hidden>
    <h2>＋ Adresse hinzufügen</h2>
    <form id="neuForm" autocomplete="off">
      <label class="feld">Unternehmen
        <input type="text" id="neuUnternehmen">
      </label>
      <label class="feld">Objektname
        <input type="text" id="neuObjektname">
      </label>
      <label class="feld">Straße und Hausnummer *
        <input type="text" id="neuStrasse" required placeholder="z. B. Marienplatz 1">
      </label>
      <div class="zeile">
        <label class="feld" style="flex:0 0 110px;min-width:0">PLZ *
          <input type="text" id="neuPlz" required inputmode="numeric" maxlength="5" pattern="\d{5}" placeholder="80331">
        </label>
        <label class="feld">Ort *
          <input type="text" id="neuOrt" required placeholder="München">
        </label>
      </div>
      <div class="knoepfe">
        <button class="btn" type="submit" id="neuSpeichern">Hinzufügen</button>
        <button class="btn zweit" type="button" id="neuAbbrechen">Abbrechen</button>
      </div>
    </form>
  </section>

  <section class="panel" id="routePanel" hidden>
    <h2>🚗 Tagesroute</h2>
    <div class="zeile">
      <label class="feld">Startpunkt
        <input type="text" id="startText" placeholder="Adresse, z. B. Hotel">
      </label>
      <button class="btn zweit" id="standortBtn" style="margin-bottom:10px">📍 Mein Standort</button>
    </div>
    <div class="zeile">
      <label class="feld">Stopps heute
        <select id="anzahl">
          <option value="" selected disabled>Bitte wählen …</option>
        </select>
      </label>
    </div>
    <p class="gedimmt" id="anzahlHinweis" style="margin:-4px 0 10px"></p>
    <label class="haken"><input type="checkbox" id="rund"> Am Ende zurück zum Startpunkt</label>
    <div class="knoepfe">
      <button class="btn" id="routeBtn">Route berechnen</button>
      <button class="btn zweit" id="routeLoeschen" hidden>Route löschen</button>
    </div>
  </section>

  <div id="karte"></div>
  <section class="panel" id="routeErgebnis" hidden></section>
  <div id="inhalt"></div>
</main>

<div id="karteikarte" hidden>
  <div class="kk-kopf">
    <button class="btn zweit" id="kkZurueck">← Zurück</button>
    <span id="kkStand"></span>
  </div>
  <div class="kk-inhalt">
    <h2 id="kkTitel"></h2>
    <div id="kkUnterzeilen" class="gedimmt"></div>
    <button class="btn zweit popup-btn" id="kkBearbeiten" style="margin-top:8px">✏️ Bearbeiten</button>

    <form class="panel" id="kkForm" autocomplete="off" hidden style="margin-top:12px">
      <h3>✏️ Daten bearbeiten</h3>
      <label class="feld">Unternehmen <input type="text" id="kkfUnternehmen"></label>
      <label class="feld">Objektname <input type="text" id="kkfObjektname"></label>
      <label class="feld">Straße und Hausnummer * <input type="text" id="kkfStrasse" required></label>
      <div class="zeile">
        <label class="feld" style="flex:0 0 110px;min-width:0">PLZ *
          <input type="text" id="kkfPlz" required inputmode="numeric" maxlength="5" pattern="\d{5}">
        </label>
        <label class="feld">Ort * <input type="text" id="kkfOrt" required></label>
      </div>
      <div class="knoepfe">
        <button class="btn" type="submit">Speichern</button>
        <button class="btn zweit" type="button" id="kkfAbbrechen">Abbrechen</button>
      </div>
    </form>
    <div class="knoepfe" style="margin:14px 0">
      <button class="btn" id="kkStatus"></button>
      <a class="btn zweit" id="kkNavi" target="_blank" rel="noopener">🚗 Hin navigieren</a>
    </div>

    <div id="kkKarte" hidden></div>

    <section class="panel">
      <h3>📷 Fotos</h3>
      <div id="kkStandort" class="gedimmt" style="margin-bottom:10px"></div>
      <label class="btn" for="kamera" id="kkFotoKnopf">📷 Foto aufnehmen</label>
      <input type="file" id="kamera" accept="image/*" capture="environment">
      <p id="kkFotoInfo" class="gedimmt" style="margin:10px 0 0"></p>
      <div class="fotos" id="kkFotos"></div>
    </section>

    <section class="panel">
      <h3>📝 Notizen</h3>
      <textarea id="kkNotizen" rows="7" placeholder="Notizen zu dieser Immobilie …"></textarea>
      <div id="kkNotizStand" class="gedimmt"></div>
    </section>

    <button class="btn zweit" id="kkEntfernen" style="color:var(--fehler)">🗑 Adresse entfernen</button>
  </div>
</div>

<div id="hinweise">
  <div class="leiste" id="originalHinweis" hidden>
    <span id="originalText"></span>
    <button class="btn" id="originalBtn">In Fotos sichern</button>
    <button class="zu" id="originalVerwerfen" title="Originale nicht sichern" aria-label="Originale nicht sichern">✕</button>
  </div>
  <div class="leiste" id="updateHinweis" hidden>
    <span>🔄 Neue Version verfügbar</span>
    <button class="btn" id="updateBtn">Aktualisieren</button>
  </div>
</div>

<div id="vollbild" hidden>
  <div class="vb-kopf">
    <span id="vbInfo"></span>
    <button class="btn zweit" id="vbZu">✕ Schließen</button>
  </div>
  <div class="vb-buehne">
    <img id="vbBild" alt="">
    <button class="vb-pfeil links" id="vbZurueck" title="Voriges Foto">‹</button>
    <button class="vb-pfeil rechts" id="vbWeiter" title="Nächstes Foto">›</button>
  </div>
  <div class="vb-fuss">
    <a id="vbDrive" target="_blank" rel="noopener">In Google Drive öffnen</a>
  </div>
</div>

<script>
// ---------- Einstellungen ----------
// Bei JEDER Änderung an dieser Datei hochsetzen (Datum + laufende Nummer),
// sonst merkt die App auf dem iPhone-Home-Bildschirm nicht, dass es eine neue Version gibt.
const APP_VERSION = '2026-10-21.1';
const SPEICHER_KEY = 'immoKartei.objekte';   // Zwischenspeicher im Browser (Hauptspeicher ist die Google-Tabelle)
const VERBINDUNG_KEY = 'immoKartei.verbindung';  // { url, code } des Google-Skripts
const AUSSTEHEND_KEY = 'immoKartei.ausstehend';  // noch nicht hochgeladene Änderungen
const GEOCODER_PAUSE_MS = 1100;              // OpenStreetMap erlaubt höchstens 1 Anfrage pro Sekunde
const START_ANSICHT = { lat: 51.16, lon: 10.45, zoom: 6 };  // Deutschland
const ROUTE_KEY = 'immoKartei.route';
// Google-Maps-App erlaubt 9 Zwischenstopps + Ziel pro Link (Safari ohne App nur 3)
const ETAPPE_STOPPS = 10;
// Fahrzeiten kommen vom kostenlosen OSRM-Server (OpenStreetMap-Straßendaten), max. 100 Punkte pro Anfrage
const OSRM_URL = 'https://router.project-osrm.org/table/v1/driving/';
const OSRM_MAX_PUNKTE = 100;
// Straßenverlauf der Tagesroute (gleicher Dienst, „route“ statt „table“)
const OSRM_ROUTE_URL = 'https://router.project-osrm.org/route/v1/driving/';
// Fotos werden vor dem Hochladen verkleinert (längste Seite in Pixeln, JPEG-Qualität)
const FOTO_MAX_PX = 2000;
const FOTO_QUALITAET = 0.8;

// Erwartete Spalten in der Excel-Datei (Groß-/Kleinschreibung egal)
const SPALTEN = {
  strasse: ['strasse_hausnummer', 'straße_hausnummer', 'strasse', 'straße'],
  plz: ['plz', 'postleitzahl'],
  ort: ['ort', 'stadt'],
};
// Diese Spalten dürfen fehlen
const SPALTEN_OPTIONAL = {
  unternehmen: ['unternehmen', 'firma'],
  objektname: ['objektname', 'objekt'],
};

// ---------- Zustand ----------
// Ein Objekt: { id, unternehmen, objektname, strasse, plz, ort, lat, lon,
//               geoStatus: 'ok'|'fehlt'|'offen', status: 'offen'|'bearbeitet', notizen }
const lesen = (key, ersatz) => {
  try { return JSON.parse(localStorage.getItem(key)) ?? ersatz; } catch { return ersatz; }
};
const merken = (key, wert) => {
  try { wert == null ? localStorage.removeItem(key) : localStorage.setItem(key, JSON.stringify(wert)); } catch {}
};

let objekte = lesen(SPEICHER_KEY, []);
let fotos = [];  // Foto-Einträge aus der Google-Tabelle (ab Schritt 4 genutzt)
let verbindung = lesen(VERBINDUNG_KEY, null);
const ausstehend = (a => ({ speichern: new Set(a.speichern), loeschen: new Set(a.loeschen) }))(
  lesen(AUSSTEHEND_KEY, { speichern: [], loeschen: [] }));

// Speichert lokal und merkt geänderte Objekte zum Hochladen vor (ids weglassen = alle)
function speichern(ids) {
  merken(SPEICHER_KEY, objekte);
  if (!verbindung) return;
  for (const id of ids || objekte.map(o => o.id)) {
    ausstehend.speichern.add(id);
    ausstehend.loeschen.delete(id);
  }
  ausstehendMerken();
  hochladenPlanen();
}
function loeschenVormerken(ids) {
  if (!verbindung) return;
  for (const id of ids) {
    ausstehend.loeschen.add(id);
    ausstehend.speichern.delete(id);
  }
  ausstehendMerken();
  hochladenPlanen();
}
function ausstehendMerken() {
  merken(AUSSTEHEND_KEY, { speichern: [...ausstehend.speichern], loeschen: [...ausstehend.loeschen] });
}

// Feste ID aus der Adresse: Nach „Liste leeren“ und erneutem Import passen Fotos wieder zum Objekt.
// Präfix „o“ = aus Excel, „m“ = von Hand eingegeben (bleibt beim Excel-Import erhalten).
function idAusAdresse(text, praefix = 'o') {
  let h = 0x811c9dc5;
  for (const zeichen of text) { h ^= zeichen.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; }
  return praefix + h.toString(36);
}
const istManuell = o => String(o.id).startsWith('m');

// Tagesroute: { start: { text, lat, lon }, ids: [Objekt-IDs in Reihenfolge], rund: bool, km }
let route = (() => {
  try { return JSON.parse(localStorage.getItem(ROUTE_KEY)); } catch { return null; }
})();
function routeSpeichern() {
  try {
    if (route) localStorage.setItem(ROUTE_KEY, JSON.stringify(route));
    else localStorage.removeItem(ROUTE_KEY);
  } catch {}
}

const schluessel = o => `${o.strasse}|${o.plz}|${o.ort}`.toLowerCase();
const adresseText = o => `${o.strasse}, ${o.plz} ${o.ort}`;
// Überschrift und Unterzeilen für Liste und Karte (ohne Objektname wird die Straße zur Überschrift)
const titel = o => o.objektname || o.strasse;
const unterzeilen = o => [
  o.unternehmen,
  o.objektname ? adresseText(o) : `${o.plz} ${o.ort}`,
].filter(Boolean);

// ---------- Karte ----------
// Hintergründe „Karte“ (OpenStreetMap) und „Satellit“ (Esri-Luftbilder mit Straßen- und Ortsnamen)
// mit Umschalter oben rechts. Die Wahl wird pro Karte unter „merkKey“ gemerkt.
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
function kartenHintergrund(karteObj, merkKey, standard) {
  const esri = (dienst, extra = {}) => L.tileLayer(ESRI + dienst + '/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 19, ...extra });
  const ebenen = {
    'Karte': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 20, maxNativeZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    }),
    'Satellit': L.layerGroup([
      esri('World_Imagery', { attribution: 'Luftbild &copy; Esri, Maxar, Earthstar Geographics' }),
      esri('Reference/World_Transportation'),
      esri('Reference/World_Boundaries_and_Places'),
    ]),
  };
  (ebenen[lesen(merkKey, standard)] || ebenen[standard]).addTo(karteObj);
  L.control.layers(ebenen, null, { position: 'topright' }).addTo(karteObj);
  karteObj.on('baselayerchange', e => merken(merkKey, e.name));
}

const karte = L.map('karte').setView([START_ANSICHT.lat, START_ANSICHT.lon], START_ANSICHT.zoom);
kartenHintergrund(karte, 'immoKartei.hintergrund', 'Karte');
const markerEbene = L.layerGroup().addTo(karte);
const marker = {};  // id -> Leaflet-Marker

function farbe(o) {
  return o.status === 'bearbeitet' ? '#2da44e' : '#1f6feb';
}

const nummerIcon = (text, klasse = '') => L.divIcon({
  className: '', html: `<div class="nr ${klasse}">${text}</div>`, iconSize: [26, 26], iconAnchor: [13, 13],
});

function karteZeichnen(zoomen) {
  markerEbene.clearLayers();
  const punkte = [];
  const routeNr = new Map((route?.ids || []).map((id, i) => [id, i + 1]));

  for (const o of objekte) {
    if (o.geoStatus !== 'ok') continue;
    const popup = `<b>${esc(titel(o))}</b><br>${unterzeilen(o).map(esc).join('<br>')}
      <br><button class="btn popup-btn" data-oeffnen="${esc(o.id)}">Karteikarte öffnen</button>`;
    const nr = routeNr.get(o.id);
    const m = nr
      ? L.marker([o.lat, o.lon], { icon: nummerIcon(nr, o.status), zIndexOffset: 1000 })
      // Adressen, die nicht in der heutigen Route sind, werden blasser gezeigt
      : L.circleMarker([o.lat, o.lon], {
          radius: 7, color: '#fff', weight: 2, fillColor: farbe(o), fillOpacity: route ? .35 : 1,
        });
    m.bindPopup(popup).addTo(markerEbene);
    marker[o.id] = m;
    if (!route || nr) punkte.push([o.lat, o.lon]);
  }

  if (route) {
    const s = route.start;
    L.marker([s.lat, s.lon], { icon: nummerIcon('S', 'start'), zIndexOffset: 2000 })
      .bindPopup(`<b>Start</b><br>${esc(s.text)}`).addTo(markerEbene);
    if (route.linie?.length) {
      // Genauer Straßenverlauf
      L.polyline(route.linie, { color: '#1f6feb', weight: 4, opacity: .75 }).addTo(markerEbene);
    } else {
      // Ersatz: gerade Linien zwischen den Stopps
      L.polyline(routePfad(), { color: '#1f6feb', weight: 3, opacity: .7, dashArray: '6 6' }).addTo(markerEbene);
      strassenverlaufNachholen();
    }
    punkte.push([s.lat, s.lon]);
  }

  if (zoomen && punkte.length) karte.fitBounds(punkte, { padding: [30, 30], maxZoom: 15 });
}

// ---------- Liste ----------
function listeZeichnen() {
  const inhalt = document.getElementById('inhalt');
  if (!objekte.length) {
    inhalt.innerHTML = `<div class="leer">Noch keine Adressen.<br>Tippe oben auf <b>Excel laden</b>.<br><br>
      Die Datei braucht die Spalten <b>Strasse_hausnummer</b>, <b>PLZ</b> und <b>Ort</b>.<br><br>
      <button class="btn zweit" data-neu>＋ Adresse von Hand eingeben</button></div>`;
    return;
  }
  const anzahl = objekte.length;
  const erledigt = objekte.filter(o => o.status === 'bearbeitet').length;
  const fehlt = objekte.filter(o => o.geoStatus === 'fehlt').length;

  // Nicht gefundene Adressen zuerst, damit sie auffallen
  const sortiert = [...objekte].sort((a, b) => (b.geoStatus === 'fehlt') - (a.geoStatus === 'fehlt'));

  inhalt.innerHTML = `
    <div style="margin-bottom:10px"><button class="btn zweit" data-neu>＋ Adresse hinzufügen</button></div>
    <div class="zaehler">
      <span>${anzahl} Adressen</span>
      <span>✅ ${erledigt} bearbeitet</span>
      <span>⏳ ${anzahl - erledigt} offen</span>
      ${fehlt ? `<span style="color:var(--fehler)">⚠️ ${fehlt} nicht gefunden</span>` : ''}
    </div>
    <ul class="liste">
      ${sortiert.map(o => `
        <li data-id="${o.id}">
          <span class="punkt ${o.geoStatus === 'fehlt' ? 'fehler' : o.status}"></span>
          <span class="adr"><b>${esc(titel(o))}</b>${unterzeilen(o).map(z => `<small>${esc(z)}</small>`).join('')}${infoZeile(o)}
            ${o.geoStatus === 'fehlt' ? `<span class="hinweis">Adresse auf der Karte nicht gefunden. ${istManuell(o)
              ? 'Bitte in der Karteikarte entfernen und mit korrigierter Schreibweise neu eingeben.'
              : 'Bitte Schreibweise in der Excel prüfen.'}</span>` : ''}
          </span>
          <button class="zeile-weg" data-weg-objekt="${o.id}" title="Adresse entfernen" aria-label="Adresse entfernen">🗑</button>
        </li>`).join('')}
    </ul>
    <div style="margin-top:14px"><button class="btn zweit" id="leeren">Liste leeren</button></div>`;

  document.getElementById('leeren').addEventListener('click', listeLeeren);
  inhalt.querySelectorAll('li[data-id]').forEach(li =>
    li.addEventListener('click', e => {
      // 🗑 in der Zeile entfernt die Adresse, sonst öffnet ein Tipp die Karteikarte
      if (e.target.closest('[data-weg-objekt]')) {
        if (adresseEntfernen(li.dataset.id)) allesZeichnen(false);
        return;
      }
      karteikarteOeffnen(li.dataset.id);
    }));
}

// Kleine Zeile „📷 3 · 📝 Notiz“ in der Liste
function infoZeile(o) {
  const anzahl = fotosVon(o.id).length;
  const teile = [anzahl ? `📷 ${anzahl}` : '', o.notizen ? '📝 Notiz' : ''].filter(Boolean);
  return teile.length ? `<small>${teile.join(' · ')}</small>` : '';
}

function allesZeichnen(zoomen) {

  routeZeichnen();
  listeZeichnen();

// Dropdown „Stopps heute“: 1 bis Anzahl aller Adressen. Die Auswahl bleibt, solange sie noch passt.
function anzahlAuswahlAktualisieren() {
  const auswahl = document.getElementById('anzahl');
  const max = objekte.length;
  if (auswahl.options.length - 1 === max) return;  // unverändert
  const gewaehlt = +auswahl.value;
  auswahl.innerHTML = '<option value="" disabled>Bitte wählen …</option>' +
    Array.from({ length: max }, (_, i) => `<option value="${i + 1}">${i + 1}</option>`).join('');
  auswahl.value = gewaehlt && gewaehlt <= max ? String(gewaehlt) : '';
  document.getElementById('anzahlHinweis').textContent =
    `Max. ${max} (alle Adressen). Ein Google-Maps-Link fasst bis zu ${ETAPPE_STOPPS} Stopps, ` +
    `bei mehr teilt die App die Route automatisch in Etappen (z. B. 17 Stopps = 2 Etappen).`;
}

function status(text) {
  document.getElementById('status').textContent = text;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---------- Excel-Import ----------
function zeilenAusExcel(arrayBuffer) {
  const mappe = XLSX.read(arrayBuffer, { type: 'array' });
  const blatt = mappe.Sheets[mappe.SheetNames[0]];
  const zeilen = XLSX.utils.sheet_to_json(blatt, { defval: '' });
  if (!zeilen.length) throw new Error('Die Excel-Datei ist leer.');

  // Spaltennamen der Datei den erwarteten Feldern zuordnen
  const kopf = Object.keys(zeilen[0]);
  const finde = namen => kopf.find(k => namen.includes(k.trim().toLowerCase()));
  const sp = { strasse: finde(SPALTEN.strasse), plz: finde(SPALTEN.plz), ort: finde(SPALTEN.ort) };
  const fehlend = Object.entries(sp).filter(([, v]) => !v).map(([k]) => k);
  if (fehlend.length) {
    throw new Error(`Spalte(n) nicht gefunden: ${fehlend.join(', ')}. Gefunden wurden: ${kopf.join(', ')}`);
  }
  const spOpt = { unternehmen: finde(SPALTEN_OPTIONAL.unternehmen), objektname: finde(SPALTEN_OPTIONAL.objektname) };
  const wert = (z, spalte) => spalte ? String(z[spalte]).trim() : '';

  return zeilen
    .map(z => ({
      unternehmen: wert(z, spOpt.unternehmen),
      objektname: wert(z, spOpt.objektname),
      strasse: String(z[sp.strasse]).trim(),
      // Excel macht aus „01234“ gern die Zahl 1234, deshalb wieder auf 5 Stellen auffüllen
      plz: String(z[sp.plz]).trim().replace(/^(\d{1,4})$/, p => p.padStart(5, '0')),
      ort: String(z[sp.ort]).trim(),
    }))
    .filter(z => z.strasse || z.plz || z.ort);
}

async function importieren(arrayBuffer) {
  let neu;
  try {
    neu = zeilenAusExcel(arrayBuffer);
  } catch (e) {
    status('❌ ' + e.message);
    return;
  }

  // Die App ist führend: Bekannte Adressen behalten alle Daten (auch in der App bearbeitete),
  // die Excel füllt nur leere Felder auf. Gefunden wird über die Adresse oder – falls die Adresse
  // in der App geändert wurde – über die ID, die einmal aus der Excel-Adresse entstanden ist.
  const alt = new Map(objekte.map(o => [schluessel(o), o]));
  const altNachId = new Map(objekte.map(o => [o.id, o]));
  const vergeben = new Set();
  objekte = neu.map(z => {
    const bekannt = alt.get(schluessel(z)) || altNachId.get(idAusAdresse(schluessel(z)));
    let id = bekannt?.id || idAusAdresse(schluessel(z));
    while (vergeben.has(id)) id += 'x';  // dieselbe Adresse doppelt in der Excel
    vergeben.add(id);
    return bekannt
      ? { ...bekannt, id, unternehmen: bekannt.unternehmen || z.unternehmen, objektname: bekannt.objektname || z.objektname }
      : { id, ...z, lat: null, lon: null, geoStatus: 'offen', status: 'offen', notizen: '' };
  });
  // Von Hand eingegebene Adressen bleiben, auch wenn sie nicht in der Excel stehen
  const drin = new Set(objekte.map(o => o.id));
  objekte.push(...[...alt.values()].filter(o => istManuell(o) && !drin.has(o.id)));
  // Adressen, die nicht mehr in der Excel stehen, auch in der Google-Tabelle löschen
  const bleibt = new Set(objekte.map(o => o.id));
  loeschenVormerken([...alt.values()].map(o => o.id).filter(id => !bleibt.has(id)));
  speichern();
  allesZeichnen(false);
  await koordinatenSuchen();
}

// ---------- Koordinaten suchen (OpenStreetMap / Nominatim) ----------
async function geocode(o) {
  const params = new URLSearchParams({
    street: o.strasse, postalcode: o.plz, city: o.ort,
    countrycodes: 'de', format: 'json', limit: '1',
  });
  const antwort = await fetch('https://nominatim.openstreetmap.org/search?' + params, {
    headers: { 'Accept-Language': 'de' },
  });
  if (!antwort.ok) throw new Error('HTTP ' + antwort.status);
  const treffer = await antwort.json();
  return treffer[0] ? { lat: +treffer[0].lat, lon: +treffer[0].lon } : null;
}

const pause = ms => new Promise(r => setTimeout(r, ms));

// Jeder Suchlauf bekommt eine Nummer. „Liste leeren“ erhöht sie, dann bricht ein laufender Suchlauf ab.
let suchLauf = 0;

function excelKnopfSperren(gesperrt) {
  const knopf = document.querySelector('label[for=datei]');
  knopf.style.pointerEvents = gesperrt ? 'none' : '';
  knopf.style.opacity = gesperrt ? .5 : '';
}

async function koordinatenSuchen() {
  const lauf = ++suchLauf;
  const offen = objekte.filter(o => o.geoStatus === 'offen');
  excelKnopfSperren(true);

  for (let i = 0; i < offen.length; i++) {
    if (lauf !== suchLauf) return;  // abgebrochen
    const o = offen[i];
    status(`🔎 Suche Adressen auf der Karte … ${i + 1} von ${offen.length}`);
    try {
      const pos = await geocode(o);
      if (pos) Object.assign(o, pos, { geoStatus: 'ok' });
      else o.geoStatus = 'fehlt';
    } catch (e) {
      // Netzwerkfehler: bleibt „offen“ und wird beim nächsten Öffnen erneut versucht
      console.warn('Geocoding fehlgeschlagen', adresseText(o), e);
    }
    if (lauf !== suchLauf) return;  // während der Anfrage abgebrochen
    speichern([o.id]);
    allesZeichnen(false);
    if (i < offen.length - 1) await pause(GEOCODER_PAUSE_MS);
  }

  excelKnopfSperren(false);
  const fehlt = objekte.filter(o => o.geoStatus === 'fehlt').length;
  const nochOffen = objekte.filter(o => o.geoStatus === 'offen').length;
  status(
    nochOffen ? `⚠️ ${nochOffen} Adressen konnten wegen eines Verbindungsproblems nicht gesucht werden. Seite neu laden, um es erneut zu versuchen.`
    : fehlt ? `Fertig. ${fehlt} Adresse(n) wurden nicht gefunden (rot markiert).`
    : objekte.length ? `Fertig. Alle ${objekte.length} Adressen sind auf der Karte.` : ''
  );
  allesZeichnen(true);
  if (offenesObjekt) karteikarteZeichnen();  // z. B. nach dem Bearbeiten einer Adresse
}

document.getElementById('datei').addEventListener('change', async e => {
  const datei = e.target.files[0];
  e.target.value = '';  // gleiche Datei erneut wählbar machen
  if (!datei) return;
  status('📄 Lese ' + datei.name + ' …');
  await importieren(await datei.arrayBuffer());
});

function listeLeeren() {
  const frage = verbindung
    ? `Wirklich alle ${objekte.length} Adressen löschen?\n\nSie werden auch aus der Google-Tabelle gelöscht. Fotos und Foto-Ordner im Google Drive bleiben erhalten.`
    : `Wirklich alle ${objekte.length} Adressen aus der Liste löschen?`;
  if (!confirm(frage)) return;
  suchLauf++;  // laufende Adresssuche abbrechen
  excelKnopfSperren(false);
  loeschenVormerken(objekte.map(o => o.id));
  objekte = [];
  speichern();
  routeVerwerfen();
  allesZeichnen(false);
  karte.setView([START_ANSICHT.lat, START_ANSICHT.lon], START_ANSICHT.zoom);
  status('Liste geleert.');
}

document.getElementById('neuForm').addEventListener('submit', async e => {
  e.preventDefault();
  const wert = id => document.getElementById(id).value.trim();
  const z = {
    unternehmen: wert('neuUnternehmen'), objektname: wert('neuObjektname'),
    strasse: wert('neuStrasse'), plz: wert('neuPlz'), ort: wert('neuOrt'),
  };
  if (!/^\d{5}$/.test(z.plz)) { status('❌ Die PLZ muss genau 5 Ziffern haben.'); return; }

  const vorhanden = objekte.find(o => schluessel(o) === schluessel(z));
  if (vorhanden) {
    neuPanelZeigen(false);
    status(`ℹ️ Diese Adresse ist schon in der Liste („${titel(vorhanden)}“).`);
    karteikarteOeffnen(vorhanden.id);
    return;
  }

  let id = idAusAdresse(schluessel(z), 'm');
  while (objekte.some(o => o.id === id)) id += 'x';
  const o = { id, ...z, lat: null, lon: null, geoStatus: 'offen', status: 'offen', notizen: '' };
  objekte.push(o);
  speichern([id]);
  neuPanelZeigen(false);
  allesZeichnen(false);

  await koordinatenSuchen();
  if (o.geoStatus === 'ok' && marker[id]) {
    status(`✅ „${titel(o)}“ hinzugefügt und auf der Karte gefunden.`);
    karte.setView(marker[id].getLatLng(), 16);
    marker[id].openPopup();
    document.getElementById('karte').scrollIntoView({ behavior: 'smooth' });
  } else if (o.geoStatus === 'fehlt') {
    status(`⚠️ „${titel(o)}“ hinzugefügt, aber auf der Karte nicht gefunden. Bitte Schreibweise prüfen (rot markiert).`);
  }
});

// ---------- Tagesroute ----------
// Entfernung in km (Luftlinie)
function km(a, b) {
  const r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}

// Fahrzeiten (Sekunden) und Strecken (Meter) zwischen allen Punkten, als Tabelle [von][nach].
// Der Routendienst nimmt max. OSRM_MAX_PUNKTE Punkte pro Anfrage. Bei mehr Punkten werden sie
// in Gruppen zu je der Hälfte geteilt und jedes Gruppenpaar einzeln abgefragt (so kommt jede
// Verbindung in mindestens einer Anfrage vor). „fortschritt(k, n)“ meldet den Stand.
async function fahrMatrix(punkte, fortschritt = () => {}) {
  const n = punkte.length;
  const alle = [...Array(n).keys()];
  let anfragen = [alle];
  if (n > OSRM_MAX_PUNKTE) {
    const groesse = Math.floor(OSRM_MAX_PUNKTE / 2);
    const gruppen = [];
    for (let i = 0; i < n; i += groesse) gruppen.push(alle.slice(i, i + groesse));
    anfragen = [];
    for (let a = 0; a < gruppen.length; a++) {
      for (let b = a + 1; b < gruppen.length; b++) anfragen.push([...gruppen[a], ...gruppen[b]]);
    }
  }

  const leer = () => Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => i === j ? 0 : 1e9));
  const dauer = leer(), meter = leer();
  for (let k = 0; k < anfragen.length; k++) {
    fortschritt(k + 1, anfragen.length);
    if (k > 0) await pause(1100);  // kostenlosen Dienst nicht überlasten
    const indizes = anfragen[k];
    const teil = await osrmTabelle(indizes.map(i => punkte[i]));
    indizes.forEach((gi, a) => indizes.forEach((gj, b) => {
      dauer[gi][gj] = teil.dauer[a][b];
      meter[gi][gj] = teil.meter[a][b];
    }));
  }
  return { dauer, meter };
}

// Eine einzelne Anfrage an den Table-Service (max. OSRM_MAX_PUNKTE Punkte)
async function osrmTabelle(punkte) {
  const koordinaten = punkte.map(p => `${p.lon.toFixed(6)},${p.lat.toFixed(6)}`).join(';');
  const antwort = await fetch(OSRM_URL + koordinaten + '?annotations=duration,distance');
  if (!antwort.ok) throw new Error('HTTP ' + antwort.status);
  const daten = await antwort.json();
  if (daten.code !== 'Ok') throw new Error(daten.code);
  // Nicht erreichbare Verbindungen (null) bekommen einen riesigen Wert, damit sie gemieden werden
  const fix = tabelle => tabelle.map(zeile => zeile.map(w => w ?? 1e9));
  return { dauer: fix(daten.durations), meter: fix(daten.distances) };
}

// Start, Stopps (und bei Rundtour wieder Start) als [lat, lon]-Liste
function routePfad() {
  const s = route.start;
  return [[s.lat, s.lon], ...routeObjekte().map(o => [o.lat, o.lon]), ...(route.rund ? [[s.lat, s.lon]] : [])];
}

// Genauer Straßenverlauf durch alle Punkte als [lat, lon]-Liste.
// Lange Routen in Stücken zu max. OSRM_MAX_PUNKTE Punkten (Stücke überlappen um einen Punkt).
async function strassenverlauf(pfad) {
  const linie = [];
  for (let i = 0; i < pfad.length - 1; i += OSRM_MAX_PUNKTE - 1) {
    if (i > 0) await pause(1100);
    const teil = await osrmRoute(pfad.slice(i, i + OSRM_MAX_PUNKTE));
    linie.push(...(linie.length ? teil.slice(1) : teil));
  }
  return linie;
}

async function osrmRoute(pfad) {
  const koordinaten = pfad.map(([lat, lon]) => `${lon.toFixed(6)},${lat.toFixed(6)}`).join(';');
  const antwort = await fetch(OSRM_ROUTE_URL + koordinaten + '?overview=full&geometries=geojson');
  if (!antwort.ok) throw new Error('HTTP ' + antwort.status);
  const daten = await antwort.json();
  if (daten.code !== 'Ok') throw new Error(daten.code);
  // 5 Nachkommastellen ≈ 1 m genau, hält den Speicher klein
  return daten.routes[0].geometry.coordinates.map(([lon, lat]) => [+lat.toFixed(5), +lon.toFixed(5)]);
}

// Für Routen ohne gespeicherten Straßenverlauf (ältere oder bei Ausfall) einmal nachladen
let verlaufVersuchtFuer = null;
function strassenverlaufNachholen() {
  if (!route || route.linie?.length || verlaufVersuchtFuer === route) return;
  verlaufVersuchtFuer = route;
  const fuer = route;
  strassenverlauf(routePfad())
    .then(linie => {
      if (route !== fuer) return;  // inzwischen neu berechnet
      route.linie = linie;
      routeSpeichern();
      karteZeichnen(false);
    })
    .catch(e => console.warn('Straßenverlauf nicht verfügbar', e));
}

// Möglichst kurze Reihenfolge ab „start“: erst immer zum nächsten Punkt (Nächster Nachbar),
// danach Kreuzungen auflösen (2-opt). Bei „rund“ endet die Route wieder am Start.
// „dist(a, b)“ liefert den Aufwand zwischen zwei Punkten (Fahrzeit oder Luftlinie).
function optimieren(start, punkte, rund, dist = km) {
  const rest = [...punkte];
  const pfad = [start];
  while (rest.length) {
    const letzter = pfad[pfad.length - 1];
    let besterIndex = 0;
    rest.forEach((p, i) => { if (dist(letzter, p) < dist(letzter, rest[besterIndex])) besterIndex = i; });
    pfad.push(rest.splice(besterIndex, 1)[0]);
  }
  if (rund) pfad.push(start);

  const ende = rund ? pfad.length - 1 : pfad.length;  // Start (und ggf. Ziel) bleiben fest
  let verbessert = true;
  while (verbessert) {
    verbessert = false;
    for (let i = 1; i < ende - 1; i++) {
      for (let j = i + 1; j < ende; j++) {
        const a = pfad[i - 1], b = pfad[i], c = pfad[j], d = pfad[j + 1];
        const vorher = dist(a, b) + (d ? dist(c, d) : 0);
        const nachher = dist(a, c) + (d ? dist(b, d) : 0);
        if (nachher < vorher - 1e-9) {
          pfad.splice(i, j - i + 1, ...pfad.slice(i, j + 1).reverse());
          verbessert = true;
        }
      }
    }
  }
  return pfad.slice(1, ende);
}

function routeObjekte() {
  const nachId = new Map(objekte.map(o => [o.id, o]));
  return (route?.ids || []).map(id => nachId.get(id)).filter(o => o && o.geoStatus === 'ok');
}

function streckeKm(start, stopps, rund) {
  const pfad = [start, ...stopps, ...(rund ? [start] : [])];
  return pfad.slice(1).reduce((summe, p, i) => summe + km(pfad[i], p), 0);
}

// 135 → „2 Std. 15 Min.“
function fahrzeitText(minuten) {
  const m = Math.round(minuten);
  return m < 60 ? `${m} Min.` : `${Math.floor(m / 60)} Std. ${m % 60} Min.`;
}

// Google-Maps-Link. Ohne „start“ beginnt Google Maps am aktuellen Standort (dann mit Sprachnavigation);
// mit „start“ zeigt Google Maps bei einem anderen Ort oft nur eine Vorschau der Route.
function mapsLink(ziele, start) {
  const params = new URLSearchParams({ api: '1', destination: ziele[ziele.length - 1], travelmode: 'driving' });
  if (start) params.set('origin', start);
  if (ziele.length > 1) params.set('waypoints', ziele.slice(0, -1).join('|'));
  return 'https://www.google.com/maps/dir/?' + params;
}

// Häkchen „Google Maps ab Startpunkt starten“ (gemerkt, Standard: an)
let abStartpunkt = lesen('immoKartei.abStartpunkt', true);

let standortPos = null;  // gesetzt über „Mein Standort“, gelöscht sobald man selbst tippt

async function startErmitteln() {
  const text = document.getElementById('startText').value.trim();
  if (standortPos) return { text: 'Mein Standort', ziel: `${standortPos.lat},${standortPos.lon}`, ...standortPos };
  if (!text) throw new Error('Bitte einen Startpunkt eingeben oder „Mein Standort“ tippen.');
  if (route && route.start.text === text) return route.start;  // nicht erneut suchen
  const params = new URLSearchParams({ q: text, countrycodes: 'de', format: 'json', limit: '1' });
  const antwort = await fetch('https://nominatim.openstreetmap.org/search?' + params, { headers: { 'Accept-Language': 'de' } });
  if (!antwort.ok) throw new Error('Startpunkt konnte nicht gesucht werden (HTTP ' + antwort.status + ').');
  const treffer = (await antwort.json())[0];
  if (!treffer) throw new Error(`Startpunkt „${text}“ wurde nicht gefunden. Bitte mit PLZ und Ort eingeben.`);
  return { text, ziel: text, lat: +treffer.lat, lon: +treffer.lon };
}

async function routeBerechnen() {
  const knopf = document.getElementById('routeBtn');
  const offen = objekte.filter(o => o.geoStatus === 'ok' && o.status === 'offen');
  if (!offen.length) { status('✅ Alle Adressen sind bereits bearbeitet.'); return; }
  const anzahl = parseInt(document.getElementById('anzahl').value, 10);
  if (!anzahl) {
    status('❌ Bitte bei „Stopps heute“ auswählen, wie viele Adressen du heute anfahren willst.');
    document.getElementById('anzahl').focus();
    return;
  }
  const rund = document.getElementById('rund').checked;

  knopf.disabled = true;
  status('🔎 Suche Startpunkt …');
  try {
    const start = await startErmitteln();

    // Fahrzeiten zwischen allen Punkten holen; klappt das nicht, wird mit Luftlinie gerechnet
    status('🚗 Berechne Fahrzeiten …');
    const punkte = [start, ...offen];
    const index = new Map(punkte.map((p, i) => [p, i]));
    let matrix = null;
    try {
      matrix = await fahrMatrix(punkte, (k, n) => {
        if (n > 1) status(`🚗 Berechne Fahrzeiten … Teil ${k} von ${n}`);
      });
    }
    catch (e) { console.warn('Fahrzeiten nicht verfügbar, nutze Luftlinie', e); }
    // Hin- und Rückweg können verschieden lang sein (Einbahnstraßen); für die Optimierung zählt der Mittelwert
    const dist = matrix
      ? (a, b) => { const i = index.get(a), j = index.get(b); return (matrix.dauer[i][j] + matrix.dauer[j][i]) / 2; }
      : km;

    // Beste Reihenfolge über ALLE offenen Adressen, davon die ersten „anzahl“ für heute.
    // So bleibt das heutige Gebiet zusammenhängend, und morgen geht es dort weiter.
    let heute = optimieren(start, offen, false, dist).slice(0, anzahl);
    if (rund) heute = optimieren(start, heute, true, dist);

    // Gesamtstrecke in Fahrtrichtung aufsummieren
    const pfad = [start, ...heute, ...(rund ? [start] : [])];
    let strecke = 0, minuten = null;
    if (matrix) {
      minuten = 0;
      for (let k = 1; k < pfad.length; k++) {
        const i = index.get(pfad[k - 1]), j = index.get(pfad[k]);
        strecke += matrix.meter[i][j] / 1000;
        minuten += matrix.dauer[i][j] / 60;
      }
    } else {
      strecke = streckeKm(start, heute, rund);
    }

    route = { start, ids: heute.map(o => o.id), rund, km: strecke, minuten, basis: matrix ? 'strasse' : 'luftlinie' };
    routeSpeichern();
    status(matrix
      ? `Route für ${heute.length} Stopps nach Fahrzeit berechnet.`
      : `⚠️ Routendienst nicht erreichbar. Route für ${heute.length} Stopps wurde nach Luftlinie berechnet. Später erneut versuchen.`);
    allesZeichnen(true);
    document.getElementById('karte').scrollIntoView({ behavior: 'smooth' });
  } catch (e) {
    status('❌ ' + e.message);
  } finally {
    knopf.disabled = false;
  }
}

function routeZeichnen() {
  const bereich = document.getElementById('routeErgebnis');
  document.getElementById('routeLoeschen').hidden = !route;
  const stopps = routeObjekte();
  if (!route || !stopps.length) { bereich.hidden = true; bereich.innerHTML = ''; return; }

  // Einträge in Etappen à ETAPPE_STOPPS aufteilen; bei Rundtour ist der Start das letzte Ziel
  const eintraege = stopps.map((o, i) => ({ nr: i + 1, o }));
  if (route.rund) eintraege.push({ start: true });
  const etappen = [];
  for (let i = 0; i < eintraege.length; i += ETAPPE_STOPPS) etappen.push(eintraege.slice(i, i + ETAPPE_STOPPS));

  const fertig = stopps.filter(o => o.status === 'bearbeitet').length;
  bereich.innerHTML = `
    <h2>Heute: ${stopps.length} Stopps · ${route.basis === 'strasse'
      ? `ca. ${Math.round(route.km)} km · ca. ${fahrzeitText(route.minuten)} Fahrzeit`
      : `ca. ${Math.round(route.km)} km Luftlinie`}</h2>
    <div style="color:var(--muted);font-size:.9rem">Start: ${esc(route.start.text)}${fertig ? ` · ✅ ${fertig} erledigt` : ''}</div>
    <label class="haken" style="margin:12px 0 0">
      <input type="checkbox" id="abStartpunkt" ${abStartpunkt ? 'checked' : ''}>
      Google Maps ab Startpunkt starten
    </label>
    <div class="gedimmt" style="margin:2px 0 0 28px">${abStartpunkt
      ? 'Etappe 1 beginnt am Startpunkt, jede weitere beim letzten Stopp davor. Google zeigt dann evtl. nur eine Vorschau: zum Losfahren Häkchen entfernen.'
      : 'Google Maps startet an deinem aktuellen Standort, mit Sprachnavigation.'}</div>
    ${etappen.map((etappe, k) => {
      // Bereits bearbeitete Stopps werden nicht mehr angefahren
      const ziele = etappe
        .filter(e => e.start || e.o.status !== 'bearbeitet')
        .map(e => e.start ? route.start.ziel : adresseText(e.o));
      // Start der Etappe: Startpunkt bzw. letzter Stopp der vorigen Etappe
      const vorige = etappen[k - 1];
      const etappenStart = !abStartpunkt ? null
        : k === 0 ? route.start.ziel
        : adresseText(vorige[vorige.length - 1].o);
      const nummern = etappe.filter(e => !e.start).map(e => e.nr);
      const bereichText = nummern.length ? `Stopp ${nummern[0]}${nummern.length > 1 ? '–' + nummern[nummern.length - 1] : ''}` : 'Rückfahrt';
      return `
        <div class="etappe">
          <h3><span>Etappe ${k + 1} · ${bereichText}</span>
            ${ziele.length ? `<a class="btn" href="${esc(mapsLink(ziele, etappenStart))}" target="_blank" rel="noopener">In Google Maps öffnen</a>` : '<span>✅ erledigt</span>'}
          </h3>
          <ol class="stopps">
            ${etappe.map(e => e.start ? `
              <li data-start><span class="nr start">S</span><span class="adr"><b>Zurück zum Start</b><small>${esc(route.start.text)}</small></span></li>` : `
              <li data-id="${e.o.id}"><span class="nr ${e.o.status}">${e.nr}</span>
                <span class="adr"><b>${esc(titel(e.o))}</b><small>${esc(adresseText(e.o))}</small></span></li>`).join('')}
          </ol>
        </div>`;
    }).join('')}`;
  bereich.hidden = false;

  bereich.querySelectorAll('li[data-id]').forEach(li =>
    li.addEventListener('click', () => karteikarteOeffnen(li.dataset.id)));
  document.getElementById('abStartpunkt').addEventListener('change', e => {
    abStartpunkt = e.target.checked;
    merken('immoKartei.abStartpunkt', abStartpunkt);
    routeZeichnen();
  });
}

}

document.getElementById('standortBtn').addEventListener('click', () => {

const fotoCache = new Map();   // dateiId -> Bild-URL (damit Fotos nur einmal geladen werden)
// Fotos, die noch hochgeladen werden: { tmpId, objektId, blob, vorschau, standort (Promise), aufgenommenAm, fehler }
const uploadSchlange = [];
let uploadLaeuft = false;
let notizTimer = null;

const objektNachId = id => objekte.find(o => o.id === id);
const fotosVon = id => fotos.filter(f => f.objektId === id);

function karteikarteZeichnen() {

    : wartend.length ? `⏳ ${wartend.length} Foto(s) werden hochgeladen …`

    : 'Noch keine Fotos.';

  // Nummer wie auf der Foto-Karte
  const badge = (f, i) => `${i + 1} · ` + (hatStandort(f) ? `📍 ±${Math.round(+f.genauigkeit || 0)} m` : '⚠️ ohne Standort');

      <div class="foto" data-foto="${esc(f.id)}">

      </div>`),

      <div class="foto wartet"><img alt="" src="${u.vorschau}"><span class="badge">${u.fehler ? '⚠️' : '⏳'} lädt hoch</span></div>`),
  ].join('');

  fotoKarteZeichnen(o, fertig);
}

const hatStandort = f => f.lat !== '' && f.lat != null && !isNaN(+f.lat);

// Bild-URL eines Fotos; lädt es beim ersten Mal aus Google Drive (gleichzeitige Anfragen werden zusammengelegt)
const fotoLadend = new Map();  // dateiId -> Promise
function fotoUrl(dateiId) {
  if (fotoCache.has(dateiId)) return Promise.resolve(fotoCache.get(dateiId));
  if (!fotoLadend.has(dateiId)) {
    fotoLadend.set(dateiId, (async () => {
      try {
        const { bild } = await api('fotoLaden', { dateiId });
        const url = URL.createObjectURL(await (await fetch('data:image/jpeg;base64,' + bild)).blob());
        fotoCache.set(dateiId, url);
        return url;
      } finally {
        fotoLadend.delete(dateiId);
      }
    })());
  }
  return fotoLadend.get(dateiId);
}

// Vorschaubilder der hochgeladenen Fotos nacheinander aus Google Drive holen
async function fotoBilderLaden() {
  for (const img of document.querySelectorAll('#kkFotos img[data-datei]')) {
    try {
      const url = await fotoUrl(img.dataset.datei);
      if (img.isConnected) img.src = url;
    } catch (e) {
      console.warn('Foto konnte nicht geladen werden', img.dataset.datei, e);
    }
  }
}

// ---------- Foto-Karte in der Karteikarte ----------
let kkKarte = null;          // Leaflet-Karte, wird beim ersten Öffnen angelegt
let kkEbene = null;
let kkFotoMarker = [];       // Index wie in fotosVon() -> Marker (oder null ohne Standort)
let kkKarteStand = '';       // nur neu zoomen, wenn sich Objekt oder Fotos ändern

function fotoKarteZeichnen(o, liste) {
  const box = document.getElementById('kkKarte');
  const mitStandort = liste.filter(hatStandort);
  if (o.geoStatus !== 'ok' && !mitStandort.length) { box.hidden = true; return; }
  box.hidden = false;

  if (!kkKarte) {
    kkKarte = L.map(box, { scrollWheelZoom: false });
    // In der Karteikarte zuerst Satellit, damit man das Gebäude sieht
    kartenHintergrund(kkKarte, 'immoKartei.hintergrundKarteikarte', 'Satellit');
    kkEbene = L.layerGroup().addTo(kkKarte);
  }
  kkKarte.invalidateSize();  // Karte war versteckt, Größe neu messen
  kkEbene.clearLayers();
  const punkte = [];

  if (o.geoStatus === 'ok') {
    L.marker([o.lat, o.lon], { icon: nummerIcon('🏠', 'haus'), zIndexOffset: -100 })
      .bindPopup(`<b>${esc(titel(o))}</b><br>${esc(adresseText(o))}`).addTo(kkEbene);
    punkte.push([o.lat, o.lon]);
  }

  kkFotoMarker = liste.map((f, i) => {
    if (!hatStandort(f)) return null;
    const zeit = f.aufgenommenAm ? new Date(f.aufgenommenAm).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' }) : '';
    const m = L.marker([+f.lat, +f.lon], { icon: nummerIcon(i + 1, 'foto') })
      .bindPopup(`<div class="pp"><img alt="Foto ${i + 1}" data-datei="${esc(f.dateiId)}" data-index="${i}">
        <div>Foto ${i + 1}${zeit ? ' · ' + zeit : ''} · ±${Math.round(+f.genauigkeit || 0)} m</div></div>`, { minWidth: 200 })
      .addTo(kkEbene);
    // Bild erst laden, wenn das Popup aufgeht
    m.on('popupopen', e => {
      const img = e.popup.getElement().querySelector('img[data-datei]');
      fotoUrl(img.dataset.datei).then(url => { img.src = url; }).catch(() => {});
    });
    punkte.push([+f.lat, +f.lon]);
    return m;
  });

  const stand = [o.id, o.lat, o.lon, ...liste.map(f => f.id)].join(',');  // neu zoomen, wenn die Adresse verschoben wurde
  if (stand !== kkKarteStand) {
    kkKarteStand = stand;
    if (punkte.length === 1) kkKarte.setView(punkte[0], 18);
    else kkKarte.fitBounds(punkte, { padding: [30, 30], maxZoom: 18 });  // 19 ist im Luftbild oft unscharf
  }
}

// Klick auf das Bild im Popup öffnet das Vollbild (Capture-Phase, weil Leaflet Popup-Klicks stoppt)

// ---------- Vollbild-Ansicht ----------
let vbIndex = 0;

function vollbildOeffnen(index) {
  if (!fotosVon(offenesObjekt).length) return;
  vbIndex = index;
  if (!history.state?.vollbild) history.pushState({ karteikarte: true, vollbild: true }, '');
  document.getElementById('vollbild').hidden = false;

async function vollbildZeigen() {
  const liste = fotosVon(offenesObjekt);
  if (!liste.length) return vollbildSchliessen();
  vbIndex = (vbIndex + liste.length) % liste.length;  // am Ende wieder von vorn
  const f = liste[vbIndex];
  const zeit = f.aufgenommenAm ? new Date(f.aufgenommenAm).toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' }) : '';
  document.getElementById('vbInfo').textContent = [
    `Foto ${vbIndex + 1} von ${liste.length}`, zeit,
    hatStandort(f) ? `📍 ±${Math.round(+f.genauigkeit || 0)} m` : '⚠️ ohne Standort',
  ].filter(Boolean).join(' · ');
  document.getElementById('vbDrive').href = `https://drive.google.com/file/d/${encodeURIComponent(f.dateiId)}/view`;
  const mehrere = liste.length > 1;
  document.getElementById('vbZurueck').hidden = !mehrere;
  document.getElementById('vbWeiter').hidden = !mehrere;
  const bild = document.getElementById('vbBild');
  bild.removeAttribute('src');
  try {
    const url = await fotoUrl(f.dateiId);
    if (liste[vbIndex] === f) bild.src = url;  // inzwischen nicht weitergeblättert
  } catch (e) {
    document.getElementById('vbInfo').textContent += ' · ❌ Foto konnte nicht geladen werden';
  }
}

function vollbildSchliessen() {
  document.getElementById('vollbild').hidden = true;
  // Das zuletzt angesehene Foto auf der Karte hervorheben
  const m = kkFotoMarker[vbIndex];
  if (m && kkKarte) {
    kkKarte.setView(m.getLatLng(), Math.max(kkKarte.getZoom(), 17));
    m.openPopup();
  }
}

const blaettern = schritt => { vbIndex += schritt; vollbildZeigen(); };
document.getElementById('vbZurueck').addEventListener('click', () => blaettern(-1));
document.getElementById('vbWeiter').addEventListener('click', () => blaettern(1));

  if (e.key === 'Escape') document.getElementById('vbZu').click();
});

// Aktueller Standort { lat, lon, genauigkeit } oder null
function standortHolen(timeout) {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lon: p.coords.longitude, genauigkeit: Math.round(p.coords.accuracy) }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout, maximumAge: 0 },
    );
  });
}

// ---------- Standort, solange eine Karteikarte offen ist ----------
// Die Ortung startet schon beim Öffnen der Karteikarte: Am iPhone geht die Erlaubnis-Frage sonst
// unter, wenn sich gleichzeitig die Kamera öffnet.
const STANDORT_MAX_ALTER_MS = 2 * 60 * 1000;  // ältere Positionen nicht mehr für Fotos verwenden
let standortWatch = null;
let letzterStandort = null;   // { lat, lon, genauigkeit, zeit }
let standortFehler = null;    // 1 = nicht erlaubt, 2 = kein Signal, 3 = dauert zu lange, 'fehlt' = kein GPS

function standortStarten() {
  standortStoppen();
  standortFehler = null;
  if (!navigator.geolocation) { standortFehler = 'fehlt'; standortAnzeigen(); return; }
  standortAnzeigen();
  standortWatch = navigator.geolocation.watchPosition(
    p => {
      letzterStandort = { lat: p.coords.latitude, lon: p.coords.longitude, genauigkeit: Math.round(p.coords.accuracy), zeit: Date.now() };
      standortFehler = null;
      standortAnzeigen();
    },
    fehler => {
      standortFehler = fehler.code;
      standortAnzeigen();
    },
    { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 },
  );
}

function standortStoppen() {
  if (standortWatch != null) navigator.geolocation.clearWatch(standortWatch);
  standortWatch = null;
}

const frischerStandort = () =>
  letzterStandort && Date.now() - letzterStandort.zeit < STANDORT_MAX_ALTER_MS ? letzterStandort : null;

function standortAnzeigen() {
  const box = document.getElementById('kkStandort');
  const pos = frischerStandort();
  if (pos && standortFehler !== 1) {
    box.textContent = `📍 Standort aktiv · ±${pos.genauigkeit} m`;
    return;
  }
  const texte = {
    1: `⚠️ <b>Standort nicht erlaubt.</b> Fotos werden ohne Standort gespeichert.<br>
        Am iPhone: <b>Einstellungen → Datenschutz &amp; Sicherheit → Ortungsdienste</b> oben einschalten,
        dann <b>Safari-Websites</b> → „Beim Verwenden der App“ wählen und „Genauer Standort“ einschalten.
        Danach die Immo-Kartei ganz schließen und neu öffnen.`,
    2: '⚠️ Kein Standort-Signal. Kurz ins Freie gehen hilft oft.',
    3: '⚠️ Der Standort braucht ungewöhnlich lange.',
    fehlt: '⚠️ Dieses Gerät kann den Standort nicht ermitteln.',
  };
  box.innerHTML = standortFehler == null
    ? '⏳ Standort wird ermittelt …'
    : texte[standortFehler] + (standortFehler === 'fehlt' ? ''
      : ' <button class="btn zweit popup-btn" id="standortNochmal">Erneut versuchen</button>');
}

document.getElementById('kkStandort').addEventListener('click', e => {
  if (e.target.closest('#standortNochmal')) standortStarten();
});

// Die genauere von zwei Positionen (kleinere Ungenauigkeit in Metern)
const genauere = (a, b) => !a ? b : !b ? a : (b.genauigkeit < a.genauigkeit ? b : a);

async function bildVerkleinern(datei) {
  const url = URL.createObjectURL(datei);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();  // Browser drehen das Bild dabei richtig herum (EXIF-Ausrichtung)
    const faktor = Math.min(1, FOTO_MAX_PX / Math.max(img.naturalWidth, img.naturalHeight));
    const leinwand = document.createElement('canvas');
    leinwand.width = Math.round(img.naturalWidth * faktor);
    leinwand.height = Math.round(img.naturalHeight * faktor);
    leinwand.getContext('2d').drawImage(img, 0, 0, leinwand.width, leinwand.height);
    return await new Promise((ok, fehler) => leinwand.toBlob(
      b => b ? ok(b) : fehler(new Error('Bild konnte nicht umgewandelt werden.')), 'image/jpeg', FOTO_QUALITAET));
  } finally {
    URL.revokeObjectURL(url);
  }
}

const blobZuBase64 = blob => new Promise((ok, fehler) => {
  const leser = new FileReader();
  leser.onload = () => ok(String(leser.result).split(',')[1]);
  leser.onerror = () => fehler(leser.error);
  leser.readAsDataURL(blob);
});

async function fotoAufgenommen(datei) {
  const objektId = offenesObjekt;
  const aufgenommenAm = new Date().toISOString();
  // Standort: der laufend ermittelte und ein frischer nach dem Auslösen – der genauere zählt.
  // Ist die Ortung nicht erlaubt, gar nicht erst warten.
  const laufend = frischerStandort();
  const standort = standortFehler === 1 || standortFehler === 'fehlt'
    ? Promise.resolve(null)
    : standortHolen(10000).then(frisch => genauere(laufend, frisch));
  let blob;
  try {
    blob = await bildVerkleinern(datei);
  } catch (e) {
    document.getElementById('kkFotoInfo').textContent = '❌ ' + e.message;
    return;
  }
  uploadSchlange.push({
    tmpId: 'u' + Date.now(), objektId, blob, vorschau: URL.createObjectURL(blob), standort, aufgenommenAm, fehler: null,
  });
  originalMerken(datei, objektId, standort, aufgenommenAm);
  if (offenesObjekt) karteikarteZeichnen();
  uploadsAbarbeiten();
}

// Lädt die wartenden Fotos nacheinander hoch; bei Fehlern alle 10 s ein neuer Versuch
async function uploadsAbarbeiten() {
  if (uploadLaeuft) return;
  uploadLaeuft = true;
  while (uploadSchlange.length) {
    const u = uploadSchlange[0];
    try {
      const pos = await u.standort;
      const o = objektNachId(u.objektId);
      const { foto } = await api('fotoHochladen', {
        objektId: u.objektId,
        ordnerName: o ? `${titel(o)} – ${adresseText(o)}` : u.objektId,
        bild: await blobZuBase64(u.blob),
        lat: pos?.lat ?? '', lon: pos?.lon ?? '', genauigkeit: pos?.genauigkeit ?? '',
        aufgenommenAm: u.aufgenommenAm,
      });
      fotoCache.set(foto.dateiId, u.vorschau);
      fotos.push(foto);
      uploadSchlange.shift();
    } catch (e) {
      u.fehler = e.message;
      if (offenesObjekt) karteikarteZeichnen();
      await pause(10000);
      continue;
    }
    if (offenesObjekt) karteikarteZeichnen();
  }
  uploadLaeuft = false;
  listeZeichnen();
}

// ---------- Originale in der Fotomediathek sichern ----------
// Hochgeladen werden nur verkleinerte Fotos. Die Originale sammelt die App und sichert sie über das
// Teilen-Menü („Bilder sichern“). Apple erlaubt Web-Apps nicht, ohne Tipp in die Fotomediathek zu
// speichern. GPS-Standort und Aufnahmezeit werden vorher in die Originale geschrieben (EXIF).
const originale = [];  // { datei: File, fertig: bool }

// Nur wo das Gerät Dateien teilen kann (iPhone); am Computer liegen die Originale ohnehin schon vor
const kannOriginaleSichern = () => {
  try { return !!navigator.canShare?.({ files: [new File([''], 'test.jpg', { type: 'image/jpeg' })] }); }
  catch { return false; }
};

function leistenPruefen() {
  document.body.classList.toggle('mit-leiste', [...document.querySelectorAll('#hinweise .leiste')].some(l => !l.hidden));
}

function originalMerken(datei, objektId, standort, aufgenommenAm) {
  if (!kannOriginaleSichern()) return;
  const eintrag = { datei, fertig: false };
  originale.push(eintrag);
  originalHinweisZeigen();
  // Erst wenn der Standort feststeht, die Datei fertig machen – beim Tippen auf „In Fotos sichern“
  // muss das Teilen-Menü sofort aufgehen, sonst blockiert das iPhone es.
  standort
    .then(pos => originalVorbereiten(datei, objektId, pos, aufgenommenAm))
    .catch(e => { console.warn('GPS/Zeit konnten nicht ins Original geschrieben werden', e); return datei; })
    .then(fertig => { eintrag.datei = fertig; eintrag.fertig = true; originalHinweisZeigen(); });
}

const dateiAlsDataUrl = datei => new Promise((ok, fehler) => {
  const leser = new FileReader();
  leser.onload = () => ok(leser.result);
  leser.onerror = () => fehler(leser.error);
  leser.readAsDataURL(datei);
});

// Original mit Dateinamen, Aufnahmezeit und (falls bekannt) GPS-Standort versehen
async function originalVorbereiten(datei, objektId, pos, aufgenommenAm) {
  const zeit = new Date(aufgenommenAm);
  const z2 = n => String(n).padStart(2, '0');
  const datum = [zeit.getFullYear(), z2(zeit.getMonth() + 1), z2(zeit.getDate())];
  const uhr = [z2(zeit.getHours()), z2(zeit.getMinutes()), z2(zeit.getSeconds())];
  const o = objektNachId(objektId);
  const name = `Immo-Kartei_${(o ? titel(o) : 'Foto').replace(/[^\wäöüÄÖÜß]+/g, '-').slice(0, 40)}_${datum.join('-')}_${uhr.join('-')}.jpg`;
  const alsDatei = inhalt => new File([inhalt], name, { type: 'image/jpeg', lastModified: zeit.getTime() });
  if (datei.type !== 'image/jpeg' || typeof piexif === 'undefined') return alsDatei(datei);

  const dataUrl = await dateiAlsDataUrl(datei);
  let vorhanden = {};
  try { vorhanden = piexif.load(dataUrl); } catch { /* Foto ohne EXIF */ }
  const exifZeit = `${datum.join(':')} ${uhr.join(':')}`;
  const gps = {};
  if (pos) {
    gps[piexif.GPSIFD.GPSLatitudeRef] = pos.lat >= 0 ? 'N' : 'S';
    gps[piexif.GPSIFD.GPSLatitude] = piexif.GPSHelper.degToDmsRational(Math.abs(pos.lat));
    gps[piexif.GPSIFD.GPSLongitudeRef] = pos.lon >= 0 ? 'E' : 'W';
    gps[piexif.GPSIFD.GPSLongitude] = piexif.GPSHelper.degToDmsRational(Math.abs(pos.lon));
  }
  const zeitFelder = { [piexif.ExifIFD.DateTimeOriginal]: exifZeit, [piexif.ExifIFD.DateTimeDigitized]: exifZeit };
  // Erst mit allen vorhandenen Angaben versuchen; klappt das nicht (unbekannte Hersteller-Daten),
  // nur Ausrichtung, Zeit und GPS schreiben.
  const voll = { '0th': vorhanden['0th'] || {}, Exif: { ...(vorhanden.Exif || {}), ...zeitFelder }, GPS: gps };
  const ausrichtung = vorhanden['0th']?.[piexif.ImageIFD.Orientation];
  const knapp = { '0th': ausrichtung ? { [piexif.ImageIFD.Orientation]: ausrichtung } : {}, Exif: zeitFelder, GPS: gps };
  let bytes;
  try { bytes = piexif.dump(voll); } catch { bytes = piexif.dump(knapp); }
  return alsDatei(await (await fetch(piexif.insert(bytes, dataUrl))).blob());
}

// ---------- Google Drive (über das Google-Skript in apps-script/Code.gs) ----------
async function api(aktion, daten = {}) {
  if (!verbindung) throw new Error('Nicht mit Google Drive verbunden.');
  // Bewusst ohne eigene Header: so fragt der Browser nicht vorab nach (CORS), das kann Google nicht beantworten
  let antwort;
  try {
    antwort = await fetch(verbindung.url, {
      method: 'POST',
      body: JSON.stringify({ code: verbindung.code, aktion, ...daten }),
    });
  } catch {
    throw new Error('Keine Internetverbindung.');
  }
  if (!antwort.ok) throw new Error(`Google antwortet mit Fehler ${antwort.status}.`);
  let ergebnis;
  try { ergebnis = await antwort.json(); }
  catch { throw new Error('Unerwartete Antwort von Google. Stimmt die Web-App-Adresse, und steht der Zugriff auf „Jeder“?'); }
  if (!ergebnis.ok) throw new Error(ergebnis.fehler);
  return ergebnis;
}

// Kopfzeilen-Knopf: ☁️ Verbinden / ☁️ ✓ / ☁️ … / ☁️ ⚠️
function cloudStatus(zustand, text = '') {
  const knopf = document.getElementById('cloudBtn');
  knopf.textContent = { aus: '☁️ Verbinden', ok: '☁️ ✓', laeuft: '☁️ …', fehler: '☁️ ⚠️' }[zustand];
  knopf.title = text || { aus: 'Nicht mit Google Drive verbunden', ok: 'Alles in Google Drive gespeichert', laeuft: 'Speichere in Google Drive …', fehler: 'Fehler' }[zustand];
  document.getElementById('verbindungInfo').textContent = {
    aus: 'Nicht verbunden. Daten liegen nur in diesem Browser.',
    ok: '✅ Verbunden. Alle Änderungen sind in Google Drive gespeichert.',
    laeuft: '⏳ Speichere in Google Drive …',
    fehler: '⚠️ ' + text + ' Änderungen bleiben vorgemerkt und werden automatisch erneut gesendet.',
  }[zustand];
}

let hochladenTimer = null;
let hochladenLaeuft = false;
function hochladenPlanen(ms = 1500) {
  clearTimeout(hochladenTimer);
  hochladenTimer = setTimeout(hochladen, ms);
}

// Sendet alle vorgemerkten Änderungen. Was währenddessen neu geändert wird, geht in die nächste Runde.
async function hochladen() {
  if (!verbindung || hochladenLaeuft) return;
  if (!ausstehend.speichern.size && !ausstehend.loeschen.size) { cloudStatus('ok'); return; }
  hochladenLaeuft = true;
  cloudStatus('laeuft');
  const loeschen = [...ausstehend.loeschen];
  const speichernIds = [...ausstehend.speichern];
  ausstehend.loeschen.clear();
  ausstehend.speichern.clear();
  let fehler = null;
  try {
    if (loeschen.length) await api('objekteLoeschen', { ids: loeschen });
    const nachId = new Map(objekte.map(o => [o.id, o]));
    const liste = speichernIds.map(id => nachId.get(id)).filter(Boolean);
    if (liste.length) await api('objekteSpeichern', { objekte: liste });
  } catch (e) {
    fehler = e;
    // Zurück in die Warteschlange (sofern nicht inzwischen anders geändert)
    loeschen.forEach(id => { if (!ausstehend.speichern.has(id)) ausstehend.loeschen.add(id); });
    speichernIds.forEach(id => { if (!ausstehend.loeschen.has(id)) ausstehend.speichern.add(id); });
  }
  ausstehendMerken();
  hochladenLaeuft = false;
  if (fehler) {
    cloudStatus('fehler', fehler.message);
    hochladenPlanen(15000);
  } else if (ausstehend.speichern.size || ausstehend.loeschen.size) {
    hochladenPlanen(500);
  } else {
    cloudStatus('ok');
  }
}

// Google-Werte (alles Text) in App-Werte umwandeln
function normalisieren(o) {
  const zahl = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
  return {
    ...o,
    plz: String(o.plz ?? '').trim().replace(/^(\d{1,4})$/, p => p.padStart(5, '0')),
    lat: zahl(o.lat), lon: zahl(o.lon),
    geoStatus: o.geoStatus || 'offen',
    status: o.status || 'offen',
    notizen: o.notizen || '',
  };
}

// Erst eigene Änderungen hochladen, dann den Stand aus Google holen.
// Ist die Google-Tabelle noch leer, werden die Adressen aus diesem Browser hochgeladen.
let synchronLaeuft = false;

async function synchronisieren() {
  synchronLaeuft = true;
  cloudStatus('laeuft');
  try {
    await hochladen();
    if (ausstehend.speichern.size || ausstehend.loeschen.size) throw new Error('Hochladen fehlgeschlagen.');
    cloudStatus('laeuft');  // hochladen() meldet „ok“, das Laden läuft aber noch

    // Stand vor dem Laden merken: Was währenddessen hier geändert wird (z. B. Excel-Import
    // bei langsamem Google), darf das Ergebnis nicht überschreiben – es wird gleich hochgeladen.
    const vorher = new Map(objekte.map(o => [o.id, JSON.stringify(o)]));
    const daten = await api('laden');
    const jetzt = new Map(objekte.map(o => [o.id, o]));
    const geaendert = new Map([...jetzt].filter(([id, o]) => vorher.get(id) !== JSON.stringify(o)));
    const geloescht = new Set([...vorher.keys()].filter(id => !jetzt.has(id)));

    const fotoIds = new Set((daten.fotos || []).map(f => f.id));
    fotos = [...(daten.fotos || []), ...fotos.filter(f => !fotoIds.has(f.id))];
    if (daten.objekte.length) {
      objekte = daten.objekte.map(normalisieren)
        .filter(o => !geloescht.has(o.id))
        .map(o => geaendert.get(o.id) || o);
      const drin = new Set(objekte.map(o => o.id));
      objekte.push(...[...geaendert.values()].filter(o => !drin.has(o.id)));
      merken(SPEICHER_KEY, objekte);
      cloudStatus(ausstehend.speichern.size || ausstehend.loeschen.size ? 'laeuft' : 'ok');
    } else if (objekte.length) {
      status(`☁️ Lade ${objekte.length} Adressen in die Google-Tabelle hoch …`);
      speichern();
      clearTimeout(hochladenTimer);
      await hochladen();
      status(ausstehend.speichern.size
        ? '⚠️ Hochladen in die Google-Tabelle fehlgeschlagen. Wird automatisch erneut versucht.'
        : `✅ ${objekte.length} Adressen in die Google-Tabelle hochgeladen.`);
    } else {
      cloudStatus('ok');
    }
    allesZeichnen(true);
    return true;
  } catch (e) {
    cloudStatus('fehler', e.message);
    status('⚠️ Google Drive: ' + e.message);
    return false;
  } finally {
    synchronLaeuft = false;
    if (objekte.some(o => o.geoStatus === 'offen')) koordinatenSuchen();
  }
}

function verbindungPanelZeigen(zeigen) {
  const panel = document.getElementById('verbindungPanel');
  panel.hidden = !zeigen;
  if (!zeigen) return;
  document.getElementById('vUrl').value = verbindung?.url || '';
  document.getElementById('vCode').value = verbindung?.code || '';
  document.getElementById('vTrennen').hidden = !verbindung;
  if (!verbindung) cloudStatus('aus');
  panel.scrollIntoView({ behavior: 'smooth' });
}

document.getElementById('cloudBtn').addEventListener('click', () =>
  verbindungPanelZeigen(document.getElementById('verbindungPanel').hidden));
document.getElementById('vSchliessen').addEventListener('click', () => verbindungPanelZeigen(false));

document.getElementById('vVerbinden').addEventListener('click', async () => {
  const url = document.getElementById('vUrl').value.trim();
  const code = document.getElementById('vCode').value.trim();
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)) {
    status('❌ Die Web-App-Adresse muss so aussehen: https://script.google.com/macros/s/…/exec');
    return;
  }
  if (!code) { status('❌ Bitte den Zugangscode eingeben.'); return; }

  const knopf = document.getElementById('vVerbinden');
  knopf.disabled = true;
  const vorher = verbindung;
  verbindung = { url, code };
  // Verbindung testen, bevor sie gespeichert wird
  try {
    await api('laden');
  } catch (e) {
    verbindung = vorher;
    knopf.disabled = false;
    status('❌ Verbindung fehlgeschlagen: ' + e.message);
    cloudStatus(vorher ? 'fehler' : 'aus', e.message);
    return;
  }
  merken(VERBINDUNG_KEY, verbindung);
  status('✅ Mit Google Drive verbunden.');
  await synchronisieren();
  knopf.disabled = false;
  verbindungPanelZeigen(false);
});

document.getElementById('vTrennen').addEventListener('click', () => {
  if (!confirm('Verbindung zu Google Drive trennen?\n\nDie Daten in Google Drive bleiben erhalten. Dieser Browser behält eine Kopie.')) return;
  verbindung = null;
  merken(VERBINDUNG_KEY, null);
  ausstehend.speichern.clear();
  ausstehend.loeschen.clear();
  ausstehendMerken();
  clearTimeout(hochladenTimer);
  verbindungPanelZeigen(false);
  cloudStatus('aus');
  status('Verbindung zu Google Drive getrennt.');
});

// ---------- Neue Version erkennen ----------
// iPhone-Home-Bildschirm-Apps laden die Seite oft lange aus dem Zwischenspeicher.
// Darum fragt die App selbst nach (am Zwischenspeicher vorbei) und bietet ein Update an.
let neueVersion = null;

async function aufUpdatePruefen() {
  try {
    const antwort = await fetch('index.html?pruefen=' + Date.now(), { cache: 'no-store' });
    if (!antwort.ok) return;
    const gefunden = (await antwort.text()).match(/const APP_VERSION = '([^']+)'/)?.[1];
    if (gefunden && gefunden !== APP_VERSION) {
      neueVersion = gefunden;
      document.getElementById('updateHinweis').hidden = false;
      leistenPruefen();
    }
  } catch { /* offline: beim nächsten Mal */ }
}

document.getElementById('updateBtn').addEventListener('click', () => {
  if (uploadSchlange.length) {
    alert('Bitte warten, bis alle Fotos hochgeladen sind. Danach erneut tippen.');
    return;
  }
  notizSpeichern();
  // Neue Adresse (?v=…) umgeht den Zwischenspeicher sicher
  location.replace(location.pathname + '?v=' + encodeURIComponent(neueVersion || Date.now()));
});

// Beim Zurückkehren in die App (iPhone pausiert sie nur) und alle 30 Minuten prüfen
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') aufUpdatePruefen();
});
setInterval(aufUpdatePruefen, 30 * 60 * 1000);

// ---------- Start ----------
if (route) {
  document.getElementById('startText').value = route.start.text === 'Mein Standort' ? '' : route.start.text;
  document.getElementById('rund').checked = route.rund;
}
allesZeichnen(true);
if (verbindung) synchronisieren();
else {
  cloudStatus('aus');
  if (objekte.some(o => o.geoStatus === 'offen')) koordinatenSuchen();
}
aufUpdatePruefen();
</script>
